services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eligibility
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eligibility"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eligibility
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Startup runs `alembic upgrade head` (currently a no-op, no
    # migrations exist yet) before serving. A future seed step will
    # be added to docker/entrypoint.sh alongside it.

volumes:
  postgres_data:
